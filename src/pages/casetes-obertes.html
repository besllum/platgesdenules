{{> header}}
<main id="contingut">
<section id="dalt" style="position:relative;z-index:0">
  <div style="position:relative;width:100%;aspect-ratio:2/1;max-height:620px;background:#e7e2d8;overflow:hidden">
    <div style="position:absolute;inset:0;overflow:hidden"><div data-yt="hiDcMqyFGFw" data-yt-params="autoplay=1&amp;mute=1&amp;loop=1&amp;playlist=hiDcMqyFGFw&amp;controls=0&amp;modestbranding=1&amp;playsinline=1&amp;rel=0&amp;showinfo=0&amp;disablekb=1&amp;iv_load_policy=3&amp;fs=0" data-yt-style="position:absolute;top:50%;left:50%;transform:translate(-50%,-50%) scale(1.35);width:100%;aspect-ratio:16/9;min-width:100%;min-height:100%;border:0;pointer-events:none"></div></div>
  </div>
</section>

<section style="padding:clamp(72px,10vw,130px) 40px">
  <div style="max-width:1400px;margin:0 auto;display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:clamp(40px,7vw,110px);align-items:start">
    <div style="display:flex;flex-direction:column;gap:22px">
      <span style="font-size:11px;letter-spacing:.26em;text-transform:uppercase;color:#37798f">{{ t.eyebrow1 }}</span>
      <h1 style="margin:0;font-family:'Cormorant Garamond',serif;font-weight:300;font-size:clamp(32px,4vw,52px);line-height:1.1;text-wrap:pretty"><span class="sr-only">{{ t.navCasetes }}: </span>{{ t.introTitleA }} <em style="font-style: normal">{{ t.introTitleB }}</em></h1>
    </div>
    <div style="display:flex;flex-direction:column;gap:22px;font-size:16px;line-height:1.85;color:#4a4740;max-width:58ch">
      <p style="margin:0;text-wrap:pretty">{{ t.introP1 }}</p>
      <p style="margin:0;text-wrap:pretty">{{ t.introP2 }}</p>
    </div>
  </div>
</section>







<section style="padding:clamp(48px,8vw,110px) 40px clamp(24px,3vw,40px)">
  <div style="max-width:1400px;margin:0 auto;display:flex;flex-direction:column;gap:clamp(24px,3vw,40px)">
    <h2 style="margin:0;font-weight:300;font-size:11px;letter-spacing:.26em;text-transform:uppercase;color:#37798f">{{ t.cartellsTitle }}</h2>
    <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:clamp(18px,2.4vw,34px)">
      <figure style="margin:0;display:flex;flex-direction:column;gap:14px">
        <div style="position:relative;width:100%;aspect-ratio:3/4;background:#e7e2d8">
          <span style="position:absolute;inset:0;display:block"><img src="/img/cartell-2026.webp" alt="{{ t.alt.cartell }} 2026 · {{ t.ed5 }}" style="width:100%;height:100%;object-fit:cover;display:block"></span>
        </div>
        <figcaption style="text-align:center;display:flex;flex-direction:column;gap:4px">
          <span style="font-size:10px;letter-spacing:.22em;text-transform:uppercase;color:#37798f">{{ t.ed5 }}</span>
          <span style="font-family:'Cormorant Garamond',serif;font-size:20px;letter-spacing:.12em;color:#6d6155">2026</span>
        </figcaption>
      </figure>
      <figure style="margin:0;display:flex;flex-direction:column;gap:14px">
        <div style="position:relative;width:100%;aspect-ratio:3/4;background:#e7e2d8">
          <span style="position:absolute;inset:0;display:block"><img src="/img/cartell-2025.webp" alt="{{ t.alt.cartell }} 2025 · {{ t.ed4 }}" style="width:100%;height:100%;object-fit:cover;display:block"></span>
        </div>
        <figcaption style="text-align:center;display:flex;flex-direction:column;gap:4px">
          <span style="font-size:10px;letter-spacing:.22em;text-transform:uppercase;color:#37798f">{{ t.ed4 }}</span>
          <span style="font-family:'Cormorant Garamond',serif;font-size:20px;letter-spacing:.12em;color:#6d6155">2025</span>
        </figcaption>
      </figure>
      <figure style="margin:0;display:flex;flex-direction:column;gap:14px">
        <div style="position:relative;width:100%;aspect-ratio:3/4;background:#e7e2d8">
          <span style="position:absolute;inset:0;display:block"><img src="/img/cartell-2024.webp" alt="{{ t.alt.cartell }} 2024 · {{ t.ed3 }}" style="width:100%;height:100%;object-fit:cover;display:block"></span>
        </div>
        <figcaption style="text-align:center;display:flex;flex-direction:column;gap:4px">
          <span style="font-size:10px;letter-spacing:.22em;text-transform:uppercase;color:#37798f">{{ t.ed3 }}</span>
          <span style="font-family:'Cormorant Garamond',serif;font-size:20px;letter-spacing:.12em;color:#6d6155">2024</span>
        </figcaption>
      </figure>
      <figure style="margin:0;display:flex;flex-direction:column;gap:14px">
        <div style="position:relative;width:100%;aspect-ratio:3/4;background:#e7e2d8">
          <span style="position:absolute;inset:0;display:block"><img src="/img/cartell-2023.webp" alt="{{ t.alt.cartell }} 2023 · {{ t.ed2 }}" style="width:100%;height:100%;object-fit:cover;display:block"></span>
        </div>
        <figcaption style="text-align:center;display:flex;flex-direction:column;gap:4px">
          <span style="font-size:10px;letter-spacing:.22em;text-transform:uppercase;color:#37798f">{{ t.ed2 }}</span>
          <span style="font-family:'Cormorant Garamond',serif;font-size:20px;letter-spacing:.12em;color:#6d6155">2023</span>
        </figcaption>
      </figure>
      <figure style="margin:0;display:flex;flex-direction:column;gap:14px">
        <div style="position:relative;width:100%;aspect-ratio:3/4;background:#e7e2d8">
          <span style="position:absolute;inset:0;display:block"><img src="/img/cartell-2022.webp" alt="{{ t.alt.cartell }} 2022 · {{ t.ed1 }}" style="width:100%;height:100%;object-fit:cover;display:block"></span>
        </div>
        <figcaption style="text-align:center;display:flex;flex-direction:column;gap:4px">
          <span style="font-size:10px;letter-spacing:.22em;text-transform:uppercase;color:#37798f">{{ t.ed1 }}</span>
          <span style="font-family:'Cormorant Garamond',serif;font-size:20px;letter-spacing:.12em;color:#6d6155">2022</span>
        </figcaption>
      </figure>
    </div>
  </div>
</section>

<section style="padding:clamp(64px,8vw,110px) 40px;background:#ece7dd">
  <div style="max-width:1400px;margin:0 auto;display:grid;grid-template-columns:minmax(0,1fr);justify-items:start">
    <form data-mailto data-subject="Casetes obertes — idea" data-ok="{{ t.ideesOk }}" style="display:flex;flex-direction:column;gap:18px;max-width:46ch;width:100%">
      <h2 style="margin:0;font-weight:300;font-size:11px;letter-spacing:.26em;text-transform:uppercase;color:#37798f">{{ t.ideesTitle }}</h2>
      <label style="display:flex;flex-direction:column;gap:8px">
        <span style="font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:#6d6155">{{ t.ideesNom }}</span>
        <input type="text" name="nom" autocomplete="given-name" required placeholder="{{ t.ideesNomPh }}" style="width:100%;padding:12px 0;border:0;border-bottom:1px solid #c9c2b4;background:transparent;font-family:inherit;font-size:15px;color:#1a1a18;outline:none" style-focus="border-color:#37798f">
      </label>
      <label style="display:flex;flex-direction:column;gap:8px">
        <span style="font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:#6d6155">{{ t.ideesCognom }}</span>
        <input type="text" name="cognoms" autocomplete="family-name" placeholder="{{ t.ideesCognomPh }}" style="width:100%;padding:12px 0;border:0;border-bottom:1px solid #c9c2b4;background:transparent;font-family:inherit;font-size:15px;color:#1a1a18;outline:none" style-focus="border-color:#37798f">
      </label>
      <label style="display:flex;flex-direction:column;gap:8px">
        <span style="font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:#6d6155">{{ t.ideesCorreu }}</span>
        <input type="email" name="correu" autocomplete="email" required placeholder="nom@correu.com" style="width:100%;padding:12px 0;border:0;border-bottom:1px solid #c9c2b4;background:transparent;font-family:inherit;font-size:15px;color:#1a1a18;outline:none" style-focus="border-color:#37798f">
      </label>
      <label style="display:flex;flex-direction:column;gap:8px">
        <span style="font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:#6d6155">{{ t.ideesText }}</span>
        <textarea rows="5" name="missatge" placeholder="{{ t.ideesPh }}" style="width:100%;padding:12px;border:1px solid #c9c2b4;background:transparent;font-family:inherit;font-size:15px;line-height:1.7;color:#1a1a18;resize:vertical;outline:none" style-focus="border-color:#37798f"></textarea>
      </label>
      <button type="submit" style="align-self:flex-start;font-family:Jost,sans-serif;font-weight:400;font-size:11px;letter-spacing:.26em;text-transform:uppercase;color:#f5f2ec;background:#37798f;border:0;border-radius:999px;padding:17px 40px;cursor:pointer" style-hover="background:#2b5f71">{{ t.ideesCta }}</button>
      <p data-msg aria-live="polite" style="margin:0;font-size:13px;color:#37798f"></p>
    </form>
  </div>
</section>
</main>
{{> footer}}
